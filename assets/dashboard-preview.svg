" y="92" class="ink" font-size="40" font-weight="650" letter-spacing="-1.7">From model evidence to a better decision.</text><text x="268" y="121" class="muted" font-size="14">Calibrated risk, graph context, anomaly evidence, expected loss, and action economics in one view.</text><rect x="1180" y="38" width="180" height="36" rx="18" fill="#f5f5f7"/><circle cx="1199" cy="56" r="5" fill="#34c759"/><text x="1212" y="60" class="ink" font-size="11" font-weight="650">Decision engine ready</text><text x="268" y="162" class="label">DECISION QUALITY</text><g filter="url(#s)"><rect class="card" x="268" y="176" width="250" height="114" rx="26"/><rect class="card" x="535" y="176" width="250" height="114" rx="26"/><rect class="card" x="802" y="176" width="250" height="114" rx="26"/><rect class="card" x="1069" y="176" width="291" height="114" rx="26"/></g><text x="290" y="207" class="label">CALIBRATED FRAUD RISK</text><text x="290" y="251" class="value">0.86</text><text x="290" y="274" class="small">High-risk synthetic event</text><text x="557" y="207" class="label">GRAPH RISK</text><text x="557" y="251" class="value">0.93</text><text x="557" y="274" class="small">Shared entity concentration</text><text x="824" y="207" class="label">EXPECTED LOSS</text><text x="824" y="251" class="value">$982</text><text x="824" y="274" class="small">Modeled exposure</text><text x="1091" y="207" class="label">RECOMMENDED ACTION</text><text x="1091" y="251" class="value">BLOCK</text><text x="1091" y="274" class="small">Lowest modeled action cost</text><rect x="268" y="324" width="526" height="250" rx="28" fill="#f5f5f7" stroke="#e8e8ed"/><text x="294" y="359" class="section">Decision evidence</text><text x="294" y="384" class="small">Signals remain inspectable instead of collapsing into one opaque score.</text><text x="294" y="425" class="label">CALIBRATED CLASSIFIER</text><rect x="294" y="440" width="430" height="12" rx="6" fill="#e5e5ea"/><rect x="294" y="440" width="370" height="12" rx="6" fill="#0071e3"/><text x="738" y="451" class="small">0.86</text><text x="294" y="480" class="label">GRAPH / RING SIGNAL</text><rect x="294" y="495" width="430" height="12" rx="6" fill="#e5e5ea"/><rect x="294" y="495" width="400" height="12" rx="6" fill="#0071e3" opacity=".78"/><text x="738" y="506" class="small">0.93</text><text x="294" y="535" class="label">BEHAVIORAL ANOMALY</text><rect x="294" y="550" width="430" height="12" rx="6" fill="#e5e5ea"/><rect x="294" y="550" width="407" height="12" rx="6" fill="#0071e3" opacity=".62"/><text x="738" y="561" class="small">98.7%</text><rect x="818" y="324" width="542" height="250" rx="28" fill="#f5f5f7" stroke="#e8e8ed"/><text x="844" y="359" class="section">Action economics</text><text x="844" y="384" class="small">Prediction and product policy stay separate.</text><text x="844" y="425" class="label">ALLOW</text><text x="844" y="458" class="value">$982</text><text x="1002" y="425" class="label">REVIEW</text><text x="1002" y="458" class="value">$206</text><text x="1160" y="425" class="label">BLOCK</text><text x="1160" y="458" class="value">$39</text><line x1="844" y1="486" x2="1333" y2="486" stroke="#d2d2d7"/><text x="844" y="520" class="small">Selected because BLOCK has the lowest modeled total cost</text><rect x="844" y="538" width="166" height="24" rx="12" fill="#e8f2ff"/><text x="927" y="554" text-anchor="middle" class="blue" font-size="11" font-weight="650">decision margin $167</text><rect x="268" y="608" width="1092" height="212" rx="28" fill="#f5f5f7" stroke="#e8e8ed"/><text x="294" y="643" class="section">Adversarial monitoring</text><text x="294" y="668" class="small">Population movement, model disagreement, and review uncertainty are monitored without inferring adversarial intent automatically.</text><text x="294" y="711" class="label">POPULATION PSI</text><rect x="294" y="728" width="270" height="12" rx="6" fill="#e5e5ea"/><rect x="294" y="728" width="176" height="12" rx="6" fill="#0071e3"/><text x="604" y="711" class="label">MODEL DISAGREEMENT</text><rect x="604" y="728" width="270" height="12" rx="6" fill="#e5e5ea"/><rect x="604" y="728" width="128" height="12" rx="6" fill="#0071e3" opacity=".72"/><text x="914" y="711" class="label">REVIEW UNCERTAINTY</text><rect x="914" y="728" width="270" height="12" rx="6" fill="#e5e5ea"/><rect x="914" y="728" width="164" height="12" rx="6" fill="#0071e3" opacity=".58"/><text x="294" y="786" class="muted" font-size="12">Event → features → calibrated ML → graph + anomaly → expected loss → cost optimization → ALLOW / REVIEW / BLOCK → feedback</text></svg>