name: SignalForge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: signalforge > /tmp/signalforge-report.json
      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          data = json.load(open('/tmp/signalforge-report.json'))
          score = data['sample_score']
          assert score['decision'] in {'ALLOW', 'REVIEW', 'BLOCK'}
          assert 0 <= score['fraud_probability'] <= 1
          assert 'evaluation' in data['report']['model']
          assert data['report']['boundary'].startswith('all metrics')
          PY
      - name: API smoke test
        run: |
          python - <<'PY'
          from signalforge.api import app
          paths = {route.path for route in app.routes}
          assert '/healthz' in paths
          assert '/score' in paths
          assert '/report' in paths
          PY
      - name: Compile
        run: python -m compileall signalforge tests spark
